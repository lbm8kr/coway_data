name: Coway Crawler Daily Schedule

# 언제 실행할지 설정
on:
  schedule:
    # 매일 한국 시간 새벽 4시에 실행 (UTC 기준 19:00)
    - cron: '0 19 * * *'
  # 수동으로 버튼을 눌러서 실행할 수 있게 허용
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 내 코드(저장소) 가져오기
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 세팅하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 필요한 라이브러리 설치하기
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 4. 파이어베이스 비밀 키 파일 생성하기
        # GitHub Secrets에 숨겨둔 텍스트를 불러와서 가상의 json 파일로 만듦
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          echo "$FIREBASE_KEY" > firebase_key.json

      - name: 5. 크롤러 스크립트 실행!
        run: python scraper.py
